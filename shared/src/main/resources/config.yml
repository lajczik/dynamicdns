# Global debug logging – logs every sync ping sent and heartbeat received
debug: false

# Automatically check for updates on startup via Modrinth
check_updates: true

# Configuration for ngrok – creates secure tunnels to local servers
ngrok:
  # Set to true to enable ngrok tunneling
  enabled: false
  # Authentication token for your ngrok account
  token: ''
  # Ngrok region (e.g., US, EU, AP, AU, SA)
  region: US

# Configuration for Dynu Dynamic DNS – updates a domain record with your current IP address
dynu:
  # Set to true to enable Dynu DDNS updates
  enabled: false
  # Domain name to be updated (e.g., yourdomain.dynu.com)
  domain: example.dynu.com
  # Dynu API client ID or username
  client: ''
  # Dynu API secret or password
  secret: ''

# Subserver address synchronization via Minecraft Handshake ping (Velocity / BungeeCord / Paper / Spigot / Sponge)
server_sync:
  # Set to true to enable synchronization (on proxy: accepts sync pings; on subserver: sends sync pings)
  enabled: false
  # Shared secret token for authenticating subservers with the proxy
  token: ""
  # Subserver unique identifier on the proxy (Subserver only, e.g. "survival")
  name: "survival"
  # Target proxy address and port (Subserver only, e.g. "123.123.123.123:25565")
  target_address: "123.123.123.123:25565"
  # Interval in seconds between sync pings sent to proxy (Subserver only)
  interval: 30