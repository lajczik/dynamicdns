# Global debug logging – logs every sync ping sent and heartbeat received
debug: false

# Automatically check for updates on startup via Modrinth
check_updates: true

# Configuration for ngrok – creates secure tunnels to local servers
ngrok:
  # Set to true to enable ngrok tunneling
  enabled: false
  # Authentication token for your ngrok account
  token: ''
  # Ngrok region (e.g., US, EU, AP, AU, SA)
  region: US

# Configuration for Dynu Dynamic DNS – updates a domain record with your current IP address
dynu:
  # Set to true to enable Dynu DDNS updates
  enabled: false
  # Domain name to be updated (e.g., yourdomain.dynu.com)
  domain: example.dynu.com
  # Dynu API client ID or username
  client: ''
  # Dynu API secret or password
  secret: ''

# Configuration for Cloudflare DNS – updates A and/or AAAA records via API v4
cloudflare:
  # Set to true to enable Cloudflare DNS updates
  enabled: false
  # API Token with Zone.DNS:Edit permissions
  api_token: ""
  # Zone ID from your Cloudflare domain overview page
  zone_id: ""
  # Domain name to update (e.g., mc.example.com)
  domain: "mc.example.com"
  # Whether to update the IPv4 (A) record
  update_ipv4: true
  # Whether to update the IPv6 (AAAA) record
  update_ipv6: false
  # Whether the DNS record should be proxied through Cloudflare (orange cloud; false recommended for Minecraft)
  proxied: false

# Configuration for DuckDNS – free dynamic DNS service
duckdns:
  # Set to true to enable DuckDNS updates
  enabled: false
  # DuckDNS subdomain name (e.g. "myserver" for myserver.duckdns.org)
  domain: ""
  # DuckDNS account token
  token: ""
  # Whether to also send IPv6 address
  update_ipv6: false

# Configuration for No-IP / DynDNS v2 protocol
noip:
  # Set to true to enable No-IP updates
  enabled: false
  # Registered hostname (e.g. example.ddns.net)
  domain: ""
  # No-IP account username
  username: ""
  # No-IP account password
  password: ""

# Subserver address synchronization via Minecraft Handshake ping (Velocity / BungeeCord / Paper / Spigot / Sponge)
server_sync:
  # Set to true to enable synchronization (on proxy: accepts sync pings; on subserver: sends sync pings)
  enabled: false
  # Shared secret token for authenticating subservers with the proxy
  token: ""
  # Subserver unique identifier on the proxy (Subserver only, e.g. "survival")
  name: "survival"
  # Target proxy address and port (Subserver only, e.g. "123.123.123.123:25565")
  target_address: "123.123.123.123:25565"
  # Interval in seconds between sync pings sent to proxy (Subserver only)
  interval: 30