author: lychee
version: ${project.version}
main: xyz.lychee.dynamicdns.bukkit.BukkitMain
name: DynamicDNS
api-version: 1.13
commands:
  dynamicdns:
    description: DynamicDNS command
    aliases: [ddns]
    permission: dynamicdns.reload
    permission-message: "&cYou do not have permission to execute this command!"
permissions:
  dynamicdns.reload:
    description: Allows reloading DynamicDNS configuration
    default: op
  dynamicdns.admin:
    description: Full access to DynamicDNS
    default: op
    children:
      dynamicdns.reload: true