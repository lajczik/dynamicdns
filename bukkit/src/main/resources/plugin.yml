author: lychee
version: ${project.version}
main: xyz.lychee.dynamicdns.bukkit.BukkitMain
name: DynamicDNS
api-version: 1.13
commands:
  dynamicdns:
    description: DynamicDNS command
    aliases: [ddns]
permissions:
  dynamicdns.admin:
    description: Full access to all DynamicDNS commands
    default: op
    children:
      dynamicdns.reload: true
      dynamicdns.update: true
      dynamicdns.status: true
      dynamicdns.sync: true
  dynamicdns.reload:
    description: Allows reloading DynamicDNS configuration
    default: op
  dynamicdns.update:
    description: Allows checking for DynamicDNS updates
    default: op
  dynamicdns.status:
    description: Allows viewing DynamicDNS status
    default: op
  dynamicdns.sync:
    description: Allows forcing a DynamicDNS sync ping
    default: op